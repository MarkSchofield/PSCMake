name: PSCMake CI
on:
  push:
    branches:
      - develop
      - feature/*
      - main
      - release/*
      - support/*
    paths-ignore:
      - '.vscode/**'
      - 'README.md'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    environment:
      name: General
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Invoke-Pester
        shell: pwsh
        run: |
          ${{ github.workspace }}/Build/RunTests.ps1
      - uses: codecov/codecov-action@v5
        with:
          files: '${{ github.workspace }}/__output/coverage.xml'
          flags: unittests
          name: codecov-umbrella
          token: '${{ secrets.CODECOV_TOKEN }}'
          fail_ci_if_error: true
          verbose: true
      - name: Build
        shell: pwsh
        run: |
          & .\Build\Publish.ps1 -Verbose
      - name: Upload __packages
        uses: actions/upload-artifact@v6
        with:
          name: __packages
          path: __packages
  release:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: PowerShellGallery
    steps:
      - name: Download __packages
        id: download
        uses: actions/download-artifact@v7
        with:
          name: __packages
          path: __packages
      - name: Publish to PowerShellGallery
        shell: pwsh
        run: |
          $ModulePath = Join-Path -Path '${{steps.download.outputs.download-path}}' -ChildPath 'PSCMake'
          Publish-Module -Path $ModulePath -NuGetApiKey '${{ secrets.PSCMAKEPUBLISH }}' -Repository PSGallery
